name: Build Android Debug APK - RIZO X ZAINU

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 🚀 Build Debug APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: 🔍 Locate Debug APK
        id: find_apk
        run: |
          APK_PATH=$(find android -name "*debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*debug.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📦 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIZO-X-ZAINU-Hosting-Bot-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: 🏷️ Create Release with APK (on push to main)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4-debug-${{ github.run_number }}
          name: "RIZO X ZAINU Hosting Bot APK v2.4 (Build #${{ github.run_number }})"
          body: |
            ## 🤖 RIZO X ZAINU Hosting Bot - 24/7 Phone RAM Engine
            
            ### 📱 Download & Install:
            Download the attached `app-debug.apk` file on your Android device and install it.
            
            ### ⚡ Features included in this build:
            - **24/7 Foreground Service** with persistent status notification
            - **PARTIAL_WAKE_LOCK** CPU keep-alive (bots never sleep)
            - **Battery Optimization Exemption** prompt
            - **Power Saving (Eco)** toggle with throttled background wakeups
            - **Auto RAM Cleanup Guard** (< 500MB threshold)
            - **CPU Intensity Heat Map** per bot
            - **Chaquopy Python 3.11** embedded environment
            
            👑 **Admin Support**: Telegram [@rizohacker](https://t.me/rizohacker)
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
